name: release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - charts/**

# chart-releaser pushes the packaged chart to a GitHub Release and updates
# index.yaml on the gh-pages branch. It only publishes charts whose `version`
# in Chart.yaml has no matching release yet, so bump the version to release.
jobs:
  release:
    name: Release chart
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: configure git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - uses: azure/setup-helm@v5

      - uses: helm/chart-releaser-action@v1.9.0
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
