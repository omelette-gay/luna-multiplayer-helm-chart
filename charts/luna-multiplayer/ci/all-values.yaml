# Used by CI to render the chart with the optional features enabled.
existingConfigSecret: example-config-secret

gameService:
  type: LoadBalancer

webService:
  ingress:
    hostname: luna.example.com
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    tls:
      - hosts:
          - luna.example.com
        secretName: luna-ingress-tls
